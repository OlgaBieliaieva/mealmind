previews:
  generation: off

services:
  - type: web
    name: mealmind-api
    runtime: node
    plan: starter
    region: frankfurt
    branch: main

    buildCommand: npm ci --include=dev && npm run build -- --filter=@mealmind/api
    preDeployCommand: npm run db:migrate:deploy
    initialDeployHook: npm run db:seed:reference
    startCommand: npm run start -w @mealmind/api

    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 15
    domains:
      - api.mealmind.in.ua

    envVars:
      - key: NODE_ENV
        value: production

      - key: API_ORIGIN
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: DIRECT_URL
        sync: false

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false

      - key: SUPABASE_SECRET_KEY
        sync: false

      - key: INVITATION_APP_ORIGIN
        sync: false

      - key: INVITATION_TTL_HOURS
        value: 72

      - key: RESEND_FROM_EMAIL
        sync: false

      - key: RESEND_API_KEY
        sync: false

      - key: SENTRY_DSN
        sync: false

      - key: SENTRY_ENVIRONMENT
        sync: false

      - key: SENTRY_RELEASE
        sync: false
