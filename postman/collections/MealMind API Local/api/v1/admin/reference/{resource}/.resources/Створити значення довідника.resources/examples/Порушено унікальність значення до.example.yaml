$kind: http-example
name: Порушено унікальність значення довідника
request:
  url: "{{baseUrl}}/api/v1/admin/reference/:resource"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    resource: product-categories
  body:
    type: json
    content: |-
      {
        "code": "test_allergen",
        "nameUa": "Алерген",
        "nameEn": "Allergen",
        "isActive": true
      }
response:
  statusCode: 409
  statusText: Conflict
  body:
    type: text
    content: ""
order: 5000
